# This workflow builds a Minecraft mod project and optionally runs its game tests in the same job, so that the game
# tests reuse the Minecraft setup and compiled classes of the build instead of preparing everything again.

name: "Build"

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version that should be used to compile the code [8, 16, 17]'
        required: true
        type: number
      gametest:
        description: 'Also run the game tests ("runGameTestServer" of all projects) after the build. A failing game test fails the job.'
        required: false
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: 'Name of uploaded artifact'
        value: gradle-build

jobs:
  build:
    # the name stays "Build" without game tests, so required status checks of other mods keep matching
    name: ${{ inputs.gametest && 'Build & Game Test' || 'Build' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java ${{ inputs.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Set branch values
        id: branch_values
        run: |
          if [ ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }} ]; then
            echo "DEPENDENCY_GRAPH=generate-and-submit" >> $GITHUB_OUTPUT
          else
            echo "DEPENDENCY_GRAPH=disabled" >> $GITHUB_OUTPUT
          fi
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: ${{ steps.branch_values.outputs.DEPENDENCY_GRAPH }}
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}

      - name: Execute Gradle build
        run: ./gradlew build --no-daemon --parallel
        
      - name: Ensure all build/libs directories exist
        run: |
          for dir in \
            build/libs \
            forge/build/libs \
            neoforge/build/libs \
            fabric/build/libs
          do
            mkdir -p "$dir"
            # Add dummy file to preserve empty directory
            touch "$dir/.keep"
            echo "checked: $dir"
          done

      - name: Upload existing JAR directories
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build
          path: |
            build/libs
            forge/build/libs
            neoforge/build/libs
            fabric/build/libs

      - name: Run game tests
        if: inputs.gametest
        run: ./gradlew runGameTestServer --no-daemon --parallel --continue

      - name: Write game test summary
        if: always() && inputs.gametest
        run: |
          shopt -s nullglob
          for report in build/gametest-report.xml */build/gametest-report.xml; do
            [ -f "$report" ] || continue
            if [ "$report" = build/gametest-report.xml ]; then loader="(root project)"; else loader="${report%%/*}"; fi
            tests=$(grep -o '<testcase ' "$report" | wc -l)
            # JUnit reports write failed assertions as <failure> and unexpected exceptions as <error>
            failures=$(grep -oE '<(failure|error)[ >/]' "$report" | wc -l)
            echo "### Game tests $loader: $tests tests, $failures failures" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload game test reports and logs
        if: always() && inputs.gametest
        uses: actions/upload-artifact@v7
        with:
          name: gametest
          if-no-files-found: ignore
          path: |
            build/gametest-report.xml
            runs/gametest/logs/
            runs/gametest/crash-reports/
            */build/gametest-report.xml
            */runs/gametest/logs/
            */runs/gametest/crash-reports/
