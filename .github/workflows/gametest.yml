# This workflow calls runGameTestServer to test a Minecraft mod project

name: "Game Test"

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version that should be used to compile the code [8, 16, 17]'
        required: true
        type: number
      arguments:
        description: 'Additional arguments for gradle run'
        required: false
        type: string
      loaders:
        description: 'JSON list of loader subprojects (e.g. ["fabric","forge","neoforge"]). Runs ":<loader>:runGameTestServer" in one job per loader. Default: one job that runs "runGameTestServer" of all projects.'
        required: false
        type: string
        default: '[""]'
      timeout-minutes:
        description: 'Maximum run time of a game test job in minutes'
        required: false
        type: number
        default: 30

jobs:
  gametest:
    # without loaders the job name stays "Game Test" (required status checks keep matching)
    name: ${{ matrix.loader != '' && format('Game Test {0}', matrix.loader) || 'Game Test' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        loader: ${{ fromJSON(inputs.loaders) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java ${{ inputs.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}

      - name: Run Game Test
        env:
          TASK: ${{ matrix.loader != '' && format(':{0}:', matrix.loader) || '' }}runGameTestServer
          ARGUMENTS: ${{ inputs.arguments }}
        # ARGUMENTS is intentionally unquoted to pass several arguments
        run: ./gradlew "$TASK" $ARGUMENTS

      - name: Write test summary
        if: always()
        run: |
          shopt -s nullglob
          for report in build/gametest-report.xml */build/gametest-report.xml; do
            [ -f "$report" ] || continue
            if [ "$report" = build/gametest-report.xml ]; then loader="(root project)"; else loader="${report%%/*}"; fi
            tests=$(grep -o '<testcase ' "$report" | wc -l)
            failures=$(grep -o '<failure' "$report" | wc -l)
            echo "### Game tests $loader: $tests tests, $failures failures" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-${{ matrix.loader != '' && matrix.loader || 'all' }}
          if-no-files-found: ignore
          path: |
            build/gametest-report.xml
            runs/gametest/logs/
            runs/gametest/crash-reports/
            */build/gametest-report.xml
            */runs/gametest/logs/
            */runs/gametest/crash-reports/
